name: decode-og-image
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode og image
        run: |
          if [ -f og_b64.txt ]; then
            base64 -d og_b64.txt > og.jpg
            rm og_b64.txt
            git config user.name "gala-bot"
            git config user.email "bot@users.noreply.github.com"
            git add og.jpg og_b64.txt
            git commit -m "Decode og.jpg preview image"
            git push
          else
            echo "nothing to decode"
          fi
